<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>namuai Gemini 자동화</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
  body { width: 320px; padding: 14px; background: #f5f5f0; color: #1a1a1a; }
  h1 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  label { font-size: 11px; color: #888; display: block; margin: 8px 0 4px; }
  input[type=text] {
    width: 100%; border: 1px solid #e0e0da; border-radius: 6px;
    padding: 7px 9px; font-size: 12px; outline: none;
  }
  input[type=text]:focus { border-color: #4a7cf6; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button {
    flex: 1; padding: 9px; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-secondary { background: #f0f0ec; color: #555; }
  .btn-danger { background: #ffefef; color: #c62828; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status-line {
    font-size: 11px; color: #666; margin-top: 10px; min-height: 14px; line-height: 1.5;
  }
  .summary { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    background: #f0f0ec; color: #666;
  }
  .chip.done  { background: #e6f7ec; color: #1e8e4a; }
  .chip.error { background: #fff0f0; color: #c62828; }
  .chip.run   { background: #f0f4ff; color: #3a5fc8; }
  .list { max-height: 160px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e8e8e4; }
  .item {
    font-size: 11px; padding: 6px 0; border-bottom: 1px solid #f0f0ec;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 700; color: #888; flex-shrink: 0; }
  .badge.done  { color: #1e8e4a; }
  .badge.error { color: #c62828; }
  .badge.run   { color: #4a7cf6; }
</style>
</head>
<body>
  <h1>🖼 namuai · Gemini 자동 생성</h1>

  <label>서버 주소</label>
  <input type="text" id="serverUrl" placeholder="http://localhost:5000">

  <label>Job ID</label>
  <input type="text" id="jobId" placeholder="예: a1b2c3d4e5">

  <div class="row">
    <button class="btn-secondary" id="btnLoad">불러오기</button>
    <button class="btn-primary" id="btnStart" disabled>자동 생성 시작</button>
  </div>
  <div class="row">
    <button class="btn-danger" id="btnStop" disabled>중지</button>
  </div>

  <div class="status-line" id="statusLine"></div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>

  <script src="popup.js"></script>
</body>
</html>
