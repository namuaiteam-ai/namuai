<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini 이미지 프롬프트 자동화</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .header {
    background: #fff;
    border-bottom: 1px solid #e8e8e4;
    padding: 20px 24px 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header p  { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.5; }

  .main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

  .section-title {
    font-size: 13px; font-weight: 600; color: #555;
    margin: 24px 0 10px; letter-spacing: 0.2px;
  }
  .section-title:first-child { margin-top: 0; }

  .card {
    background: #fff; border: 1px solid #e8e8e4;
    border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
  }

  textarea, input[type=text], input[type=number], select {
    width: 100%; font-size: 13px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px;
    background: #fff; color: #1a1a1a;
  }
  textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  label.field-label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row + .row { margin-top: 10px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }

  .checkbox-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .checkbox-line input { width: auto; }

  .hint { font-size: 11px; color: #aaa; margin-top: 6px; line-height: 1.5; }
  .warn {
    font-size: 12px; color: #a15c00; background: #fff6e5;
    border: 1px solid #ffe3a3; border-radius: 8px; padding: 8px 10px; margin-top: 10px;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  button {
    font-size: 14px; font-weight: 600; border: none; border-radius: 10px;
    padding: 12px 18px; cursor: pointer;
  }
  .btn-primary { background: #4a7cf6; color: #fff; flex: 1; }
  .btn-primary:disabled { background: #b9c9f2; cursor: not-allowed; }
  .btn-secondary { background: #f0f0ec; color: #555; }

  .progress-wrap {
    background: #eee; border-radius: 20px; height: 8px; overflow: hidden; margin: 10px 0;
  }
  .progress-bar { background: #4a7cf6; height: 100%; width: 0%; transition: width .25s; }

  #status-msg { font-size: 13px; color: #444; margin-bottom: 4px; }

  .log-box {
    background: #101014; color: #d6d6da; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 11.5px; border-radius: 10px; padding: 12px 14px; height: 160px;
    overflow-y: auto; line-height: 1.6; white-space: pre-wrap;
  }

  .result-group { margin-bottom: 14px; }
  .result-prompt { font-size: 12.5px; color: #555; margin-bottom: 6px; font-weight: 600; }
  .result-images { display: flex; flex-wrap: wrap; gap: 8px; }
  .result-images img {
    width: 110px; height: 110px; object-fit: cover; border-radius: 8px;
    border: 1px solid #e8e8e4; cursor: pointer;
  }
  .no-images { font-size: 12px; color: #aaa; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Gemini 이미지 프롬프트 자동화</h1>
  <p>여러 프롬프트를 Gemini 챗창에 순서대로 입력하고, 생성된 이미지를 저장합니다.</p>
</div>

<div class="main">

  <div class="section-title">프롬프트</div>
  <div class="card">
    <div class="field">
      <label class="field-label">한 줄에 하나씩 입력</label>
      <textarea id="prompts" placeholder="노을 지는 해변, 유화 스타일&#10;눈 내리는 산속 오두막, 수채화 스타일"></textarea>
    </div>
    <div class="field">
      <label class="field-label">또는 프롬프트 파일 업로드 (.txt, 줄 단위)</label>
      <input type="file" id="prompts_file" accept=".txt">
    </div>
  </div>

  <div class="section-title">설정</div>
  <div class="card">
    <div class="field">
      <label class="field-label">Chrome 프로필 경로 (로그인 세션 유지)</label>
      <input type="text" id="profile_dir" value="gemini_chrome_profile">
    </div>
    <div class="row">
      <div class="field">
        <label class="field-label">chromedriver 확보 방식</label>
        <select id="driver_manager">
          <option value="auto">auto (Selenium Manager)</option>
          <option value="webdriver-manager">webdriver-manager</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">헤드리스 모드</label>
        <div class="checkbox-line" style="height:36px; align-items:center;">
          <input type="checkbox" id="headless">
          <span>백그라운드 실행 (창 숨김)</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label class="field-label">프롬프트 간 대기(초)</label>
        <input type="number" id="delay" value="5" step="0.5" min="0">
      </div>
      <div class="field">
        <label class="field-label">응답 대기 제한(초)</label>
        <input type="number" id="response_timeout" value="180" step="10" min="10">
      </div>
    </div>
    <div class="warn">
      최초 실행 시 Google 로그인이 필요합니다. 로그인 창은 헤드리스 모드에서 차단될 수 있으니,
      처음에는 헤드리스를 끈 상태로 한 번 로그인해 주세요. 이후에는 같은 프로필 경로를 사용하면
      로그인이 유지됩니다.
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="start-btn" onclick="startJob()">실행</button>
    <button class="btn-secondary hidden" id="stop-btn" onclick="stopJob()">중지</button>
  </div>

  <div id="progress-section" class="card hidden" style="margin-top:16px;">
    <div id="status-msg">대기 중...</div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="log-box" id="log-box"></div>
  </div>

  <div id="results-section" class="hidden">
    <div class="section-title">결과</div>
    <div id="results-body"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="zip-btn" onclick="downloadZip()">전체 이미지 ZIP 다운로드</button>
    </div>
  </div>

</div>

<script>
let currentJobId = null;
let evtSource = null;

async function startJob() {
  const prompts = document.getElementById('prompts').value;
  const fileInput = document.getElementById('prompts_file');

  const fd = new FormData();
  fd.append('prompts', prompts);
  if (fileInput.files[0]) fd.append('prompts_file', fileInput.files[0]);
  fd.append('profile_dir', document.getElementById('profile_dir').value);
  fd.append('driver_manager', document.getElementById('driver_manager').value);
  fd.append('headless', document.getElementById('headless').checked ? 'on' : '');
  fd.append('delay', document.getElementById('delay').value);
  fd.append('response_timeout', document.getElementById('response_timeout').value);

  const res = await fetch('/start', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  currentJobId = data.job_id;
  document.getElementById('start-btn').disabled = true;
  document.getElementById('stop-btn').classList.remove('hidden');
  document.getElementById('progress-section').classList.remove('hidden');
  document.getElementById('results-section').classList.add('hidden');
  document.getElementById('log-box').textContent = '';
  document.getElementById('progress-bar').style.width = '0%';

  listenProgress(currentJobId);
}

function listenProgress(jobId) {
  if (evtSource) evtSource.close();
  evtSource = new EventSource(`/progress/${jobId}`);
  const logBox = document.getElementById('log-box');

  evtSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.error) { evtSource.close(); return; }

    if (typeof data.pct === 'number') {
      document.getElementById('progress-bar').style.width = data.pct + '%';
    }
    if (data.msg) {
      document.getElementById('status-msg').textContent = data.msg;
      logBox.textContent += data.msg + '\n';
      logBox.scrollTop = logBox.scrollHeight;
    }
    if (data.status === 'done' || data.status === 'error') {
      evtSource.close();
      document.getElementById('start-btn').disabled = false;
      document.getElementById('stop-btn').classList.add('hidden');
      if (data.status === 'done') loadResults(jobId);
    }
  };
}

async function stopJob() {
  if (!currentJobId) return;
  await fetch(`/stop/${currentJobId}`, { method: 'POST' });
}

async function loadResults(jobId) {
  const res = await fetch(`/status/${jobId}`);
  const job = await res.json();
  const body = document.getElementById('results-body');
  body.innerHTML = '';

  (job.results || []).forEach((r) => {
    const group = document.createElement('div');
    group.className = 'result-group';

    const title = document.createElement('div');
    title.className = 'result-prompt';
    title.textContent = r.prompt;
    group.appendChild(title);

    if (r.images.length === 0) {
      const none = document.createElement('div');
      none.className = 'no-images';
      none.textContent = '이미지 없음';
      group.appendChild(none);
    } else {
      const imgWrap = document.createElement('div');
      imgWrap.className = 'result-images';
      r.images.forEach((path) => {
        const filename = path.split('/').pop().split('\\').pop();
        const img = document.createElement('img');
        img.src = `/image/${jobId}/${filename}`;
        img.onclick = () => window.open(img.src, '_blank');
        imgWrap.appendChild(img);
      });
      group.appendChild(imgWrap);
    }
    body.appendChild(group);
  });

  document.getElementById('results-section').classList.remove('hidden');
}

function downloadZip() {
  if (!currentJobId) return;
  window.location.href = `/download_zip/${currentJobId}`;
}
</script>

</body>
</html>
